[package]
name = "mosaic-core"
version = "0.2.0"
edition = "2021"
description = "On-device collage, photobook, curation, and similarity engine for Mosaic."
license = "MIT"

[lib]
name = "mosaic_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
